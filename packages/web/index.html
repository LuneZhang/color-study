<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111411" />
    <meta name="description" content="调色书房：有来源的调色教程、色彩手册与个人学习记录。" />
    <title>调色书房 · 把调色练成自己的判断</title>
    <script>try{const t=JSON.parse(localStorage.getItem('cs:theme')||'"dark"');document.documentElement.dataset.theme=t==='light'?'light':'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
